          max_keep: null
  - name: hpc_stage1_vmamba_attention_rowtube_layernorm_seed234
    patch:
      trainer: train_videomamba
      meta.seed: 234
      model.model_name: videomamba_tiny
      model.use_vit_pred: true
      model.target_transform: layer_norm
      data.mask_type: row_tube
      mask:
        - ratio: 0.5
          shared_rows_across_batch: false
