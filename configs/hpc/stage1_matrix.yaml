base_config: configs/hpc/stage1_base.yaml
output_root: diagnostic_runs/hpc_stage1
config_root: diagnostic_runs/configs/hpc_stage1
budget:
  eur_cap: 1000.0
  price_eur_per_lumi_gpu_hour: 0.35
  setup_fraction: 0.10
  reserve_fraction: 0.20
  # Stage-1 templates target one LUMI small-g GCD. LUMI bills one GCD-hour as
  # 0.5 full MI250X GPU-hour before CPU/memory thresholds.
  lumi_gpu_modules_per_node: 0.5
  estimated_wall_ms_per_microstep: 1250.0
run:
  launch: local
  devices:
    - cuda:0
variants:
  - name: hpc_stage1_vit_multiblock_layernorm_seed234
    patch:
      trainer: train
      meta.seed: 234
      model.model_name: vit_tiny
      model.pred_depth: 2
      model.pred_embed_dim: 96
      model.target_transform: layer_norm
      data.mask_type: multiblock3d
      mask:
        - aspect_ratio:
            - 0.75
            - 1.5
          num_blocks: 2
          spatial_scale:
            - 0.25
            - 0.25
          temporal_scale:
            - 1.0
            - 1.0
          max_temporal_keep: 1.0
          max_keep: null
  - name: hpc_stage1_vit_multiblock_layernorm_seed235
    patch:
      trainer: train
      meta.seed: 235
      model.model_name: vit_tiny
      model.pred_depth: 2
