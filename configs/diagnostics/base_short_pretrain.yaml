app: vjepa
trainer: train_videomamba
nodes: 1
tasks_per_node: 1
data:
  dataset_type: VideoDataset
  mask_type: multiblock3d
  datasets:
    - /absolute/path/to/SSv2_train_subset.csv
  decode_one_clip: true
  batch_size: 4
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 4
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 4
  filter_short_videos: false
  clip_duration: null
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
    - 0.75
    - 1.35
  random_resize_scale:
    - 0.3
    - 1.0
  reprob: 0.0
logging:
  folder: diagnostic_runs/phase1/base
  write_tag: base
loss:
  loss_exp: 1.0
  reg_coeff: 0.0
mask:
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 8
    spatial_scale:
      - 0.15
      - 0.15
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 2
    spatial_scale:
      - 0.7
      - 0.7
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
meta:
  load_checkpoint: false
  read_checkpoint: null
  seed: 234
  eval_freq: 100
  dtype: bfloat16
model:
  model_name: videomamba_tiny
  pred_depth: 4
  pred_embed_dim: 144
  pred_head_dim: 72
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true
  use_vit_pred: false
  target_transform: layer_norm
optimization:
  ipe: 20
  ipe_scale: 1.0
  clip_grad: 10.0
  weight_decay: 0.1
  final_weight_decay: 0.4
  epochs: 5
  accumulation_steps: 1
  warmup: 1
  start_lr: 2.0e-05
  lr: 7.5e-05
  final_lr: 1.0e-06
  ema:
    - 0.998
    - 1.0
  eps: 1.0e-06
  betas:
    - 0.9
    - 0.98
