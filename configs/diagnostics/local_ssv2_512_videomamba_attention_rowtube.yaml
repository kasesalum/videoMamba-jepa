app: vjepa
trainer: train_videomamba
nodes: 1
tasks_per_node: 1
data:
  dataset_type: VideoDataset
  mask_type: row_tube
  datasets:
    - diagnostic_runs/data/ssv2_subset/ssv2_train_512.csv
  decode_one_clip: true
  batch_size: 2
  num_clips: 1
  num_frames: 4
  tubelet_size: 2
  sampling_rate: 2
  crop_size: 64
  patch_size: 16
  pin_mem: false
  num_workers: 0
  filter_short_videos: true
  clip_duration: null
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
    - 0.9
    - 1.1
  random_resize_scale:
    - 0.8
    - 1.0
  reprob: 0.0
logging:
  folder: diagnostic_runs/local_ssv2_512/videomamba_attention_rowtube
  write_tag: local_ssv2_512_videomamba_attention_rowtube
loss:
  loss_exp: 1.0
  reg_coeff: 0.0
mask:
  - ratio: 0.5
    shared_rows_across_batch: false
meta:
  load_checkpoint: false
  read_checkpoint: null
  seed: 234
  eval_freq: 100
  dtype: float32
model:
  model_name: videomamba_tiny
  pred_depth: 2
  pred_embed_dim: 96
  pred_head_dim: 96
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true
  use_vit_pred: true
  target_transform: layer_norm
optimization:
  ipe: 256
  ipe_scale: 1.0
  clip_grad: 10.0
  weight_decay: 0.1
  final_weight_decay: 0.1
  epochs: 3
  accumulation_steps: 1
  warmup: 0
  start_lr: 2.0e-05
  lr: 7.5e-05
  final_lr: 1.0e-06
  ema:
    - 0.998
    - 1.0
  eps: 1.0e-06
  betas:
    - 0.9
    - 0.98
